        <svg width="150" height="150" xmlns="http://www.w3.org/2000/svg">
            <rect x="20" y="20" rx="20" width="100" height="100" fill="blue" />
        </svg>

        <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="70" r="60" fill="green" />
        </svg>

        <svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="90" fill="none" stroke="black" stroke-width="4" />
            <circle cx="100" cy="100" r="5" fill="black" />
            <line x1="100" y1="100" x2="150" y2="100" stroke="black" stroke-width="6" />
            <line x1="100" y1="100" x2="100" y2="20" stroke="black" stroke-width="4" />
